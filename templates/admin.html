<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>God Incorporated Admin</title>
  <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main>
    <header class="branding">
      <div class="brand-name">GODINCORPORATED.AI</div>
      <h1>Admin Console</h1>
      <p id="adminIdentity">Loading admin identity...</p>
    </header>

    <section>
      <h2>System Overview</h2>
      <div>
        <label for="overviewDays">Window (days):</label>
        <input type="number" id="overviewDays" value="30" min="1" max="365" />
        <button type="button" id="refreshOverviewBtn">Refresh Overview</button>
      </div>
      <pre id="overviewOutput">Loading overview...</pre>
    </section>

    <section>
      <h2>User Search</h2>
      <form id="adminSearchForm">
        <div>
          <label for="searchEmail">Email</label>
          <input type="text" id="searchEmail" name="email" />
        </div>

        <div>
          <label for="searchDisplayName">Display name</label>
          <input type="text" id="searchDisplayName" name="display_name" />
        </div>

        <div>
          <label for="searchSeekerId">Seeker ID</label>
          <input type="text" id="searchSeekerId" name="seeker_id" />
        </div>

        <div>
          <label for="searchLimit">Limit</label>
          <input type="number" id="searchLimit" name="limit" value="25" min="1" max="100" />
        </div>

        <button type="submit">Search</button>
      </form>

      <div id="searchStatus"></div>
      <pre id="searchResults">No search run yet.</pre>
    </section>

    <section>
      <h2>User Detail</h2>
      <div>
        <label for="detailUserId">User ID</label>
        <input type="text" id="detailUserId" />
        <button type="button" id="loadDetailBtn">Load Detail</button>
      </div>
      <pre id="detailOutput">No user loaded yet.</pre>
    </section>

    <section>
      <h2>Recent Admin Actions</h2>
      <div>
        <label for="adminActionsLimit">Limit</label>
        <input type="number" id="adminActionsLimit" value="100" min="1" max="500" />
        <button type="button" id="refreshAdminActionsBtn">Refresh Admin Actions</button>
      </div>
      <pre id="adminActionsOutput">Loading admin actions...</pre>
    </section>
  </main>

  <script src="/static/admin.js"></script>
</body>
</html>
