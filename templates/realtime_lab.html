<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="/static/style.css?v=20260826-css1" />
  <title>Realtime Oracle Voice Lab</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4ecd9;
      color: #2e2418;
    }
    main {
      max-width: 860px;
      margin: 0 auto;
      background: rgba(255,255,255,0.62);
      border: 1px solid rgba(92,70,42,0.28);
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 12px 32px rgba(49,34,18,0.12);
    }
    h1 {
      margin-top: 0;
      font-size: 1.6rem;
    }
    .notice {
      background: #fff8e8;
      border: 1px solid rgba(117,86,42,0.28);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 18px;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 18px 0;
    }
    button {
      border: 0;
      border-radius: 999px;
      padding: 12px 16px;
      background: #5b4228;
      color: #fff8e8;
      font-weight: 700;
      cursor: pointer;
    }
    button.secondary {
      background: #8b7455;
    }
    button.danger {
      background: #7f2d22;
    }
    button:disabled {
      opacity: 0.48;
      cursor: not-allowed;
    }
    #status {
      font-weight: 700;
      margin: 14px 0;
    }
    audio {
      width: 100%;
      margin: 12px 0 18px;
    }
    pre {
      white-space: pre-wrap;
      word-break: break-word;
      background: #24190f;
      color: #f7ecd7;
      border-radius: 12px;
      padding: 14px;
      min-height: 220px;
      max-height: 420px;
      overflow: auto;
      font-size: 0.88rem;
    }

    .answer-panel {
      margin-top: 1rem;
    }

    .last-answer {
      min-height: 5rem;
      white-space: pre-wrap;
      line-height: 1.55;
      padding: 1rem;
      border: 1px solid rgba(103, 72, 43, 0.35);
      border-radius: 0.75rem;
      background: rgba(255, 250, 240, 0.75);
    }

    .answer-actions {
      margin-top: 0.75rem;
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }


    .voice-lab-header {
      max-width: 980px;
      margin: 0 auto 1.25rem;
      text-align: center;
    }

    .voice-lab-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 0.75rem;
      margin-top: 0.85rem;
      font-size: 0.95rem;
    }

    .voice-lab-links a {
      font-weight: 700;
      color: inherit;
    }

  </style>
</head>
<body class="temple-backdrop-page">
  <header class="voice-lab-header">
    <a class="brand-name brand-home-link brand-lockup" href="/temple" aria-label="Return to the Temple">
      <span class="godinc-wordmark">godincorporated.ai</span>
    </a>
    <div class="nav-cross temple-back-cross brand-mark-divider" aria-hidden="true"><span></span><strong><img class="godinc-divider-mark" src="/static/img/godinc-mark.svg?v=20260514-brand2" alt="" aria-hidden="true"></strong><span></span></div>
    <nav class="voice-lab-links" aria-label="Admin voice lab links">
      <a href="/admin">Admin Console</a>
      <a href="/voice-preview">Voice Preview</a>
    </nav>
  </header>




  <main>
    <h1>Realtime Oracle Voice Lab</h1>

    <div class="notice">
      This hidden staging lab tests true realtime voice. It does not replace the Temple voice flow.
      Use headphones if possible to reduce echo.
    </div>

    <div class="controls">
      <button id="startHathorButton" type="button">Start Hathor Realtime</button>
      <button id="startMosesButton" type="button" class="secondary">Start Moses Realtime</button>
      <button id="stopButton" type="button" class="danger" disabled>Stop Session</button>
    </div>

    <div id="status">Idle.</div>

    <audio id="remoteAudio" autoplay playsinline controls></audio>

    <h2>Event Log</h2>

      <section class="lab-panel answer-panel">
        <h2>Last Answer</h2>
        <div id="lastAnswer" class="last-answer">No answer yet.</div>
        <div class="answer-actions">
          <button id="copyAnswerButton" type="button" disabled>Copy Answer</button>
          <button id="printAnswerButton" type="button" disabled>Print Answer</button>
        </div>
      </section>

<pre id="eventLog"></pre>
  </main>

  <script src="/static/realtime_lab.js?v=11.5a"></script>
</body>
</html>
